<body><div class="wrap"><main class="game-shell"><canvas id="game"></canvas><div class="hud"><div class="topbar"><div><div class="brand">NIGHT SHIFT <span>//</span> BLACKWATER</div><div class="mission">ST. MARROW MEMORIAL • EMERGENCY POWER: 18%</div></div><div class="level" id="level">LEVEL 01 <small>TRIAGE WING</small></div></div><div class="toast" id="toast"></div><div class="crosshair" id="crosshair"></div><div class="stats"><div class="label"><span>VITALS</span><span id="hpText">100 / 100</span></div><div class="bar"><div id="hp" class="fill hp" style="width:100%"></div></div><div class="label" style="margin-top:9px"><span>ADRENALINE</span><span id="stamText">100%</span></div><div class="bar"><div id="stam" class="fill stam" style="width:100%"></div></div></div><div class="ammo" id="ammo">12 <b>/ 48</b><small>9MM SERVICE PISTOL</small></div><div class="hint">WASD / ARROWS MOVE &nbsp;•&nbsp; MOUSE AIM &nbsp;•&nbsp; CLICK / SPACE FIRE &nbsp;•&nbsp; R RELOAD</div><div class="joystick" id="joy"><div class="joyknob"></div></div><div class="damage" id="damage"></div></div></main></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={}, mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload();if(e.code==='Space')mouse.down=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouse.down=false});c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let level=1,score=0,shake=0,last=0,spawnTimer=0,fireTimer=0,reloadTimer=0,player={x:0,y:0,hp:100,stam:100,ammo:12,angle:0},enemies=[],bullets=[],particles=[],blood=[],decos=[];const names=['TRIAGE WING','NORTH PATIENTS','SURGERY THEATER','MORGUE ACCESS','PEDIATRICS','ROOF HELIPAD','THE RED WARD'];
function toast(t){let z=document.getElementById('toast');z.textContent=t;z.classList.add('show');setTimeout(()=>z.classList.remove('show'),1900)}function newLevel(){level++;enemies=[];bullets=[];player.x=0;player.y=0;player.hp=Math.min(100,player.hp+25);player.ammo=12;toast(level===7?'BOSS INCOMING // THE WARDEN':'LEVEL '+String(level).padStart(2,'0')+' // '+names[level-1]);document.getElementById('level').innerHTML='LEVEL '+String(level).padStart(2,'0')+' <small>'+names[level-1]+'</small>'}
function rand(a,b){return a+Math.random()*(b-a)}function addBlood(px,py,n=10){for(let i=0;i<n;i++)blood.push({x:px,y:py,vx:rand(-2,2),vy:rand(-2,2),r:rand(1,4),life:rand(30,90)})}function spawn(){let a=Math.random()*Math.PI*2,r=Math.max(W,H)*.42+rand(50,180);let boss=level===7&&enemies.length===0;enemies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:boss?160:rand(22,42),max:boss?160:42,r:boss?34:18,speed:boss?0.45:rand(.55,1.05),boss,phase:rand(0,8),hit:0})}
function shoot(){if(reloadTimer||fireTimer>0)return;if(player.ammo<=0){reload();return}player.ammo--;fireTimer=10;let a=player.angle+rand(-.035,.035),sx=player.x+Math.cos(a)*22,sy=player.y+Math.sin(a)*22;bullets.push({x:sx,y:sy,vx:Math.cos(a)*13,vy:Math.sin(a)*13,life:45});for(let i=0;i<7;i++)particles.push({x:sx,y:sy,vx:rand(-2,2)+Math.cos(a)*rand(1,4),vy:rand(-2,2)+Math.sin(a)*rand(1,4),life:rand(8,18),col:'#ffd27a'});shake=3}function reload(){if(!reloadTimer&&player.ammo<12)reloadTimer=55}
function update(dt){let speed=2.5,dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){let q=Math.hypot(dx,dy);player.x+=dx/q*speed*dt;player.y+=dy/q*speed*dt}player.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);if(mouse.down||keys[' '])shoot();fireTimer-=dt;if(reloadTimer>0){reloadTimer-=dt;if(reloadTimer<=0)player.ammo=12}spawnTimer-=dt;if(spawnTimer<0&&enemies.length<(level===7?1:4+level)){spawnTimer=level===7?999:Math.max(22,65-level*6);spawn()}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies)if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){e.hp-=25;b.life=0;e.hit=5;addBlood(e.x,e.y,7);break}}bullets=bullets.filter(b=>b.life>0);for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x),dist=Math.hypot(player.x-e.x,player.y-e.y);if(dist>e.r+18){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}if(dist<e.r+19){player.hp-=.18*dt;document.getElementById('damage').classList.add('hit');setTimeout(()=>document.getElementById('damage').classList.remove('hit'),250)}e.phase+=dt*.08;e.hit=Math.max(0,e.hit-dt)}let dead=enemies.filter(e=>e.hp<=0);if(dead.length){score+=dead.length*(level===7?1000:100);dead.forEach(e=>addBlood(e.x,e.y,22));enemies=enemies.filter(e=>e.hp>0);if(level===7&&dead.some(e=>e.boss)){toast('WARDEN DOWN // HOSPITAL CLEARED');setTimeout(()=>{level=0;newLevel()},2200)}else if(level<7&&score>=(level)*500)newLevel()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let b of blood){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.95;b.vy*=.95;b.life-=dt}blood=blood.filter(b=>b.life>0);if(player.hp<=0){player.hp=100;score=0;level=1;enemies=[];toast('YOU DID NOT MAKE IT OUT // RESETTING')}document.getElementById('hp').style.width=player.hp+'%';document.getElementById('hpText').textContent=Math.ceil(player.hp)+' / 100';document.getElementById('ammo').innerHTML=(reloadTimer?'—':player.ammo)+' <b>/ '+(reloadTimer?'RELOADING':'48')+'</b><small>9MM SERVICE PISTOL</small>'}
function drawMonster(e){x.save();x.translate(e.x,e.y);let bob=Math.sin(e.phase)*2;x.translate(0,bob);x.shadowBlur=e.boss?20:8;x.shadowColor=e.boss?'#ff203c':'#be2639';x.fillStyle=e.boss?'#411822':'#202832';x.beginPath();x.ellipse(0,7,e.r*.78,e.r,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle=e.boss?'#75283a':'#374047';x.beginPath();x.arc(0,-e.r*.55,e.r*.62,0,7);x.fill();x.fillStyle='#15191d';x.beginPath();x.ellipse(0,-e.r*.36,e.r*.45,e.r*.26,0,0,7);x.fill();x.fillStyle='#ff5360';x.beginPath();x.arc(-e.r*.23,-e.r*.57,3,0,7);x.arc(e.r*.23,-e.r*.57,3,0,7);x.fill();x.strokeStyle='#b8c5c2';x.lineWidth=2;x.beginPath();x.moveTo(-e.r*.35,-e.r*.13);x.lineTo(-e.r*.68,4);x.moveTo(e.r*.35,-e.r*.13);x.lineTo(e.r*.68,4);x.stroke();if(e.boss){x.strokeStyle='#ed5363';x.lineWidth=3;x.beginPath();x.arc(0,0,e.r+7,0,7);x.stroke()}x.restore();if(e.boss){x.fillStyle='#000b';x.fillRect(e.x-42,e.y-e.r-25,84,5);x.fillStyle='#e23c50';x.fillRect(e.x-42,e.y-e.r-25,84*e.hp/e.max,5)}}
function draw(){x.clearRect(0,0,W,H);let ox=W/2-player.x,oy=H/2-player.y;x.save();x.translate(ox,oy);x.fillStyle='#111a1e';x.fillRect(-2000,-2000,4000,4000);let grid=70;x.strokeStyle='#253137';x.lineWidth=2;for(let i=-2000;i<2000;i+=grid){x.beginPath();x.moveTo(i,-2000);x.lineTo(i,2000);x.stroke();x.beginPath();x.moveTo(-2000,i);x.lineTo(2000,i);x.stroke()}for(let i=0;i<30;i++){let px=(i*317%1800)-900,py=(i*173%1200)-600;x.fillStyle=i%2?'#192428':'#202c30';x.fillRect(px,py,90,30);x.fillStyle='#8eaf9d';x.fillRect(px+12,py+10,18,3);x.fillRect(px+43,py+10,25,3)}for(let b of blood){x.globalAlpha=Math.max(0,b.life/70);x.fillStyle='#8d1728';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}x.globalAlpha=1;for(let e of enemies)drawMonster(e);for(let b of bullets){x.fillStyle='#ffe9a4';x.shadowBlur=10;x.shadowColor='#ffb35c';x.beginPath();x.arc(b.x,b.y,3,0,7);x.fill();x.shadowBlur=0}x.save();x.translate(player.x,player.y);x.rotate(player.angle);x.shadowBlur=20;x.shadowColor='#8fffff';x.fillStyle='#d4e0da';x.fillRect(5,-5,29,10);x.fillStyle='#92a8a5';x.fillRect(-11,-12,19,24);x.fillStyle='#202a2e';x.fillRect(-9,-17,13,5);x.fillStyle='#f6bd91';x.beginPath();x.arc(1,0,9,0,7);x.fill();x.fillStyle='#0c1216';x.beginPath();x.arc(-3,0,10,Math.PI*.5,Math.PI*1.5);x.fill();x.restore();x.restore();let g=x.createRadialGradient(W/2,H/2,55,W/2,H/2,300);g.addColorStop(0,'#ffffd033');g.addColorStop(.25,'#bfffff16');g.addColorStop(1,'#000c');x.fillStyle=g;x.fillRect(0,0,W,H);for(let p of particles){x.globalAlpha=p.life/18;x.fillStyle=p.col;x.fillRect(p.x+ox,p.y+oy,3,3)}x.globalAlpha=1;document.getElementById('crosshair').style.left=mouse.x+'px';document.getElementById('crosshair').style.top=mouse.y+'px'}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}toast('NIGHT SHIFT // FIND THE EXIT');requestAnimationFrame(loop);
</script><style>.ending{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:radial-gradient(circle,#233d3dcc,#05080cee 70%);text-align:center}.ending.show{display:grid}.ending-card{padding:38px 44px;border:1px solid #71e9e0aa;background:#0b141bd9;box-shadow:0 0 45px #71e9e044;max-width:560px}.ending h1{font:800 62px 'Barlow Condensed';letter-spacing:6px;margin:0;color:#71e9e0}.ending p{color:#b5caca;line-height:1.7;font-size:12px}.ending button{border:1px solid #71e9e0;background:#71e9e01a;color:#dff;padding:12px 22px;font:700 12px 'Space Mono';cursor:pointer}.ending button:hover{background:#71e9e055}</style><div class="ending" id="ending"><div class="ending-card"><h1>DAWN BREAKS</h1><p>THE WARDEN IS DOWN.<br>Seven levels of Blackwater Hospital survived.<br><span id="finalScore"></span></p><button id="restart">RETURN TO THE NIGHT SHIFT</button></div></div><script>
// Combat expansion: reliable reloads, weapon pickups, enemy variants, touch joystick and WebAudio.
let reserve=96,reloadCost=0,reloadToken=0,gun={name:'SERVICE PISTOL',mag:12,damage:25,delay:10,spread:.035,color:'#ffd27a'},pickup=null,audioCtx,bossDefeated=false;
function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=kind==='reload'?'sine':'sawtooth';o.frequency.setValueAtTime(kind==='shot'?110:kind==='pickup'?520:180,now);o.frequency.exponentialRampToValueAtTime(kind==='shot'?55:kind==='pickup'?900:260,now+.09);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(kind==='shot'?.16:.08,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+.12);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.13)}catch(e){}}
function reload(){if(reloadTimer||player.ammo>=gun.mag||reserve<=0)return;let token=++reloadToken;reloadCost=Math.min(gun.mag-player.ammo,reserve);reloadTimer=-75;sound('reload');toast('RELOADING // '+gun.name);setTimeout(()=>{if(token!==reloadToken)return;let load=Math.min(reloadCost,reserve);player.ammo=Math.min(gun.mag,player.ammo+load);reserve-=load;reloadCost=0;reloadTimer=0;sound('pickup');toast('MAGAZINE READY // '+player.ammo+' ROUNDS')},1250)}
function shoot(){if(reloadTimer||fireTimer>0)return;if(player.ammo<=0){reload();return}player.ammo--;fireTimer=gun.delay;sound('shot');let a=player.angle+rand(-gun.spread,gun.spread),sx=player.x+Math.cos(a)*22,sy=player.y+Math.sin(a)*22;bullets.push({x:sx,y:sy,vx:Math.cos(a)*13,vy:Math.sin(a)*13,life:45,damage:gun.damage});for(let i=0;i<7;i++)particles.push({x:sx,y:sy,vx:rand(-2,2)+Math.cos(a)*rand(1,4),vy:rand(-2,2)+Math.sin(a)*rand(1,4),life:rand(8,18),col:gun.color});shake=3}
const enemyTypes=[{type:'crawler',hp:24,r:14,speed:1.55,color:'#6e934e'},{type:'brute',hp:72,r:25,speed:.38,color:'#8d3447'},{type:'stalker',hp:36,r:17,speed:.88,color:'#4b5c88'}];
function spawn(){let a=Math.random()*Math.PI*2,r=Math.max(W,H)*.42+rand(50,180),boss=level===7&&enemies.length===0,t=boss?{type:'warden',hp:340,r:40,speed:.75,color:'#a52d48'}:enemyTypes[Math.floor(Math.random()*enemyTypes.length)];enemies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,hp:t.hp,max:t.hp,r:t.r,speed:t.speed,boss,etype:t.type,color:t.color,phase:rand(0,8),hit:0})}
function touchControls(){let joy=document.getElementById('joy'),knob=joy.querySelector('.joyknob');function move(e){e.preventDefault();let r=joy.getBoundingClientRect(),px=e.touches[0].clientX-r.left-58,py=e.touches[0].clientY-r.top-58,l=Math.hypot(px,py),m=37;if(l>m){px=px/l*m;py=py/l*m}knob.style.transform='translate('+px+'px,'+py+'px)';keys.d=px>8;keys.a=px<-8;keys.s=py>8;keys.w=py<-8}joy.addEventListener('touchstart',move,{passive:false});joy.addEventListener('touchmove',move,{passive:false});joy.addEventListener('touchend',()=>{['w','a','s','d'].forEach(k=>keys[k]=false);knob.style.transform=''})}touchControls();
setInterval(()=>{if(!pickup&&Math.random()<.28){let guns=[{name:'TACTICAL SHOTGUN',mag:6,damage:48,delay:22,spread:.16,color:'#ff9f62'},{name:'SMG',mag:28,damage:14,delay:5,spread:.08,color:'#a9e7ff'}];pickup={x:player.x+rand(-260,260),y:player.y+rand(-180,180),gun:guns[Math.floor(Math.random()*guns.length)]}}},9000);
let oldUpdate=update;update=function(dt){if(reloadTimer>0)reloadTimer=Math.max(1,reloadTimer-dt);oldUpdate(dt);if(pickup&&Math.hypot(player.x-pickup.x,player.y-pickup.y)<34){gun=pickup.gun;player.ammo=gun.mag;pickup=null;sound('pickup');toast('FOUND // '+gun.name)}};
let oldDraw=draw;draw=function(){oldDraw();if(pickup){let ox=W/2-player.x,oy=H/2-player.y;x.save();x.translate(pickup.x+ox,pickup.y+oy);x.rotate(performance.now()/500);x.fillStyle='#7df4e6';x.shadowBlur=18;x.shadowColor='#7df4e6';x.fillRect(-12,-7,24,14);x.fillStyle='#102327';x.fillRect(-7,-3,14,6);x.restore()}document.getElementById('ammo').innerHTML=(reloadTimer?'—':player.ammo)+' <b>/ '+reserve+'</b><small>'+gun.name+(reloadTimer?' // RELOADING':'')+'</small>'};let baseMonster=drawMonster;drawMonster=function(e){baseMonster(e);if(e.etype&&e.etype!=='warden'){x.save();x.translate(e.x,e.y);x.fillStyle=e.color;x.globalAlpha=.75;x.beginPath();x.arc(0,-e.r*.55,e.r*.3,0,7);x.fill();if(e.etype==='crawler'){x.strokeStyle='#bbd67a';x.lineWidth=3;x.beginPath();x.moveTo(-e.r,5);x.lineTo(-e.r-8,10);x.moveTo(e.r,5);x.lineTo(e.r+8,10);x.stroke()}if(e.etype==='brute'){x.strokeStyle='#ff7b6e';x.lineWidth=3;x.strokeRect(-e.r*.8,-e.r*.9,e.r*1.6,e.r*1.4)}x.restore()}};
</script><script>
// Floor identities and ending transition.
const floorTint=['#8db8c0','#759fc2','#a17cad','#b76f6f','#74b48b','#9da6ba','#c45563'];let finishLevel=newLevel;newLevel=function(){if(level===0){bossDefeated=true;document.getElementById('finalScore').textContent='FINAL SCORE // '+score;document.getElementById('ending').classList.add('show');return}finishLevel();document.querySelector('.game-shell').style.filter='hue-rotate('+(level*13)+'deg) saturate('+(1+level*.06)+')'};document.getElementById('restart').onclick=()=>location.reload();
</script></body></html>
