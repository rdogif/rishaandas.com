<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"math"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,805;1,805&display=swap" rel="stylesheet">
</head>
<script src="https://kit.fontawesome.com/f19d30c178.js" crossorigin="anonymous"></script>
<style>
    :root {
        --main : rgb(36, 13, 57);
        --main2: rgb(59, 24, 91); 
        --snd: rgb(178, 135, 221);
        --rpx: 10px;
    }
    body{
        background-color: var(--main);
        color: white;
        font-family: "Comic Neue",cursive;
        
        

    }
    @keyframes rotate {
        0% {
            transform: rotateZ(5deg);
        }
        
        50%{
                transform: rotateZ(-5deg);
        
        }
        100%{
            transform: rotateZ(5deg);
        }
    }
    h1 {
        margin: 25px auto;
        text-align: center;
        background-color: blueviolet;
        border-radius: 20%;
        width: fit-content;
        padding: 30px 60px;
        box-shadow: 0px 0px 25px 1px var(--snd) ;
        animation: rotate 2s  infinite ease-in-out;
    }
    .games {
       margin-top: 50px;
        display: grid;
        
        justify-content: center;
        grid-template-columns: repeat(3,200px);
        gap: 10px;
    }
    .game {
         border-radius: var(--rpx);
        border: 2px solid rgb(183, 79, 224);
        box-shadow: 0px 0px 20px 0px rgb(183, 79, 224) ;
        overflow-wrap: break-word;
        display: flex;
        justify-content: start;
        flex-direction:column;
        align-content: center;
        height: 300px;
        background-color: var(--main2);
        width: 200px;
        font-size: 1em;
        transition: 0.1s ease-in-out;
        text-align: center;
        padding-bottom: 20px;
    }
    .game img {
        border-radius: var(--rpx) var(--rpx) 0px 0px;
        object-fit: cover;
        
        width: 200px;
    }
    .game h2 {
        
       
    }
    .game:hover{
        cursor: pointer;
         box-shadow: 0px 0px 20px 0px rgb(255, 255, 255) ;
        border-color: rgb(255, 255, 255);
        transform: scale(1.05);
    
       
    }
    



</style>
<body>
    <h1>Totally Math!<br><i style="margin-top: 20px;" class="fa-solid fa-gamepad"></i></h1>
    <div class="games">
        <div id="rb1" class="game"><img src="https://www.rishaandas.com/education/totallymath/images/rishaanboss1.png"> <h2>Beat Boss Rishaan</h2><p style="margin-top: -14px;">Vibecoded slop game where you beat boss Rishaan (promise this site isnt vibecoded)<p></div>
        
    </div>
</body>
<script>
    const rd1 = document.getElementById("rb1");
    rd1.addEventListener("click",()=>{
        open("math1.html","_self")


    })











</script>
</html>
