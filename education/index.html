<style>
    body {
        background-color: rgb(128, 128, 128);
        color: white;
        text-align: center;
        font-family: "lato", sans-serif;
        
    }
    body > h1:first-of-type {
        margin-top: 10px;
        text-shadow: 4px 4px 10px rgb(0, 0, 0);
        font-size: 5em;
    }
    .container {
        height: 100vh;
        display: flex;
        justify-content: center;
        column-gap: 10px;
    }
    .box {
        box-shadow: 0px 0px 20px 0px rgb(255, 230, 0);
        border: 4px rgb(234, 255, 0) solid;
        border-radius: 10%;
        width: 300px;
        height: 400px;
        color: rgb(255, 255, 255);
    }
    .box:hover{
        box-shadow: 0px 0px 20px 0px rgb(223, 255, 119);
        color: rgb(205, 205, 205);
        
        cursor: pointer;
    }
    .box:active {
        box-shadow: 0px 0px 20px 0px rgb(255, 255, 255);
        color: rgb(255, 255, 255);
    }

    

@keyframes shake {
    0%, 100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-15px);
    }
    50% {
        transform: translateX(15px);
    }
    75% {
        transform: translateX(-15px);
    }
}




   

</style>
